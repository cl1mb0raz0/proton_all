services:
  pdrive:
    build: .
    image: pdrive:latest
    pull_policy: build
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      PDRIVE_KEY: "${PDRIVE_KEY:-}"
      PDRIVE_PUBLIC_PORT: "${PDRIVE_PORT:-8765}"
      PDRIVE_LOCAL_LABEL: "${PDRIVE_DATA_DIR}"
    ports:
      # Loopback Only: The Interface Is Not Reachable From The Network.
      - "127.0.0.1:${PDRIVE_PORT:-8765}:8765"
    volumes:
      - "${PDRIVE_DATA_DIR:?Set PDRIVE_DATA_DIR in .env}:/data"
      - pdrive-config:/config

volumes:
  pdrive-config:
