<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proton All</title>
  <meta name="description" content="Interactive Apps For Proton Drive">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#files" title="Proton All, Files">
        <img class="brand-logo" src="/logo.png" alt="" width="40" height="40">
        <span class="brand-name">Proton<br>All</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#files" data-view="files">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.8l1.4 1.5h4.8A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5v-7Z"/></svg>
          Files
        </a>
        <a href="#compare" data-view="compare">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 5h8M8 2.5 10.5 5 8 7.5M13.5 11h-8M8 8.5 5.5 11 8 13.5"/></svg>
          Compare
        </a>
        <a href="#transfers" data-view="transfers">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2.5v10M2.5 10 5 12.5 7.5 10M11 13.5v-10M8.5 6 11 3.5 13.5 6"/></svg>
          Transfers
          <span class="nav-badge" id="nav-jobs" hidden></span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="links"><button class="btn-link" id="login" type="button">In</button> <button class="btn-link" id="logout" type="button">Out</button> <button class="btn-link" id="folder" type="button">Folder</button></div>
      </div>
    </aside>
    <main class="main">
      <ul class="messages" id="messages" hidden></ul>
      <section id="view-files"></section>
      <section id="view-compare" hidden></section>
      <section id="view-transfers" hidden></section>
    </main>
  </div>
  <div class="overlay" id="overlay" hidden></div>
</body>
</html>
